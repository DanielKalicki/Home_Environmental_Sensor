[package]
name = "xiao-esp32s3"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-backtrace = { version = "0.14", features = ["esp32s3", "panic-handler", "exception-handler", "println"] }
# `opsram-8m` matches the ESP32-S3R8 module on the XIAO: 8 MB of octal-SPI
# PSRAM. The measurement history lives there instead of in internal RAM.
esp-hal = { version = "0.20", features = ["esp32s3", "async", "opsram-8m"] }
esp-hal-embassy = { version = "0.3", features = ["esp32s3", "integrated-timers"] }
esp-println = { version = "0.12", default-features = false, features = ["esp32s3", "jtag-serial"] }
esp-wifi = { version = "0.9", default-features = false, features = ["esp32s3", "wifi", "async", "embassy-net", "phy-enable-usb", "wifi-default"] }
embassy-executor = { version = "0.6", features = ["task-arena-size-40960"] }
embassy-net = { version = "0.4", features = ["tcp", "udp", "dhcpv4", "medium-ethernet", "dns"] }
embassy-sync = "0.6"
embassy-time = "0.3"
# The async read/write traits the TCP sockets are driven through.
embedded-io-async = "0.6"
# The `ReadStorage`/`Storage` traits the flash is reached through.
embedded-storage = "0.3"
# Raw SPI-flash access, used to keep BSEC's learned gas baseline across
# reboots; see `src/utils/flash_store.rs`. `critical-section` and `storage` are
# default features and are both needed: the first keeps interrupts out of the
# erase/write window, the second supplies the trait implementations.
esp-storage = { version = "0.4", features = ["esp32s3"] }
heapless = "0.8"
# Supplies the C math functions the prebuilt BSEC library links against; see
# `src/drivers/bsec/math_shims.rs`.
libm = "0.2"
static_cell = { version = "2", features = ["nightly"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
